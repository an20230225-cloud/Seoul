<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小及郎 ＆ 湯及｜貳仟圓日常分帳本 (TWD)</title>
    <!-- 載入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 載入 Google Fonts: Noto Sans TC 與 Noto Serif TC (紙鈔古典字體感) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --banknote-dark: #2E1442;
            --banknote-royal: #4A235A;
            --banknote-violet: #6C3483;
            --banknote-light: #F5EEF8;
            --banknote-gold: #D4AC0D;
        }
        body {
            font-family: 'Inter', 'Noto Sans TC', sans-serif;
            background-color: #F4ECF7;
            /* 紙鈔防偽細微斜紋底圖 */
            background-image: 
                radial-gradient(circle at 15% 20%, rgba(142, 68, 173, 0.08) 0%, transparent 45%),
                radial-gradient(circle at 85% 80%, rgba(74, 35, 90, 0.08) 0%, transparent 45%),
                repeating-linear-gradient(45deg, rgba(91, 44, 111, 0.025) 0px, rgba(91, 44, 111, 0.025) 2px, transparent 2px, transparent 8px);
        }
        .font-serif-banknote {
            font-family: 'Noto Serif TC', serif;
        }
        /* 台幣 2000 元紙鈔質感卡片漸層與防偽圓紋 */
        .banknote-card {
            background: linear-gradient(135deg, #3B1E54 0%, #5B2C6F 55%, #4A235A 100%);
            position: relative;
            overflow: hidden;
        }
        .banknote-card::before {
            content: '';
            position: absolute;
            top: -40%;
            right: -15%;
            width: 280px;
            height: 280px;
            border-radius: 50%;
            border: 18px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 0 0 18px rgba(255, 255, 255, 0.03), inset 0 0 0 14px rgba(255, 255, 255, 0.04);
            pointer-events: none;
        }
        .banknote-card::after {
            content: '2000';
            position: absolute;
            bottom: -14px;
            right: 16px;
            font-family: 'Noto Serif TC', serif;
            font-size: 5.5rem;
            font-weight: 700;
            line-height: 1;
            color: rgba(255, 255, 255, 0.06);
            letter-spacing: -0.04em;
            pointer-events: none;
            user-select: none;
        }
        /* 紙鈔邊框花紋裝飾線 */
        .guilloche-divider {
            height: 4px;
            background-image: repeating-linear-gradient(
                90deg,
                #8E44AD 0px,
                #8E44AD 6px,
                #D2B4DE 6px,
                #D2B4DE 12px
            );
            opacity: 0.45;
        }
        /* 自訂捲軸 */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #EBDEF0;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: #AF7AC5;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #8E44AD;
        }
    </style>
</head>
<body class="text-slate-800 antialiased pb-16 min-h-screen">

    <!-- 隱藏的圖片上傳 Input (點擊頭貼時觸發) -->
    <input type="file" id="avatar-file-input" accept="image/*" class="hidden">
    <!-- 隱藏的 JSON 備份還原 Input -->
    <input type="file" id="backup-file-input" accept=".json,application/json" class="hidden">

    <!-- 頂部導覽列 (貳仟圓深紫主題) -->
    <header class="bg-[#2E1442] text-white shadow-lg sticky top-0 z-30 border-b border-purple-400/20">
        <div class="max-w-4xl mx-auto px-4 py-3.5 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <!-- 紙鈔貳仟圓徽章 -->
                <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-purple-500/40 to-fuchsia-600/30 border border-purple-300/40 flex flex-col items-center justify-center shadow-inner">
                    <span class="font-serif-banknote text-xs font-bold text-purple-100 leading-none">貳仟</span>
                    <span class="text-[9px] text-purple-300 tracking-widest mt-0.5">TWD</span>
                </div>
                <div>
                    <h1 class="text-base sm:text-lg font-bold tracking-wide text-purple-50 flex items-center gap-1.5">
                        <span>小及郎 ＆ 湯及</span>
                        <span class="text-xs font-normal bg-purple-800/80 text-purple-200 px-2 py-0.5 rounded-full border border-purple-500/30">專屬分帳</span>
                    </h1>
                    <p class="text-[11px] text-purple-300/90 hidden sm:block">點擊頭貼可隨時更換大頭照・資料自動存於本機</p>
                </div>
            </div>

            <!-- 備份與重置操作區 -->
            <div class="flex items-center space-x-1.5 sm:space-x-2">
                <button id="btn-export-backup" title="匯出備份檔 (.json)" class="text-xs bg-purple-900/70 hover:bg-purple-800 text-purple-200 px-2.5 py-2 rounded-xl transition border border-purple-500/30 flex items-center space-x-1">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
                    </svg>
                    <span class="hidden sm:inline">匯出備份</span>
                </button>
                <button id="btn-import-backup" title="匯入備份檔還原" class="text-xs bg-purple-900/70 hover:bg-purple-800 text-purple-200 px-2.5 py-2 rounded-xl transition border border-purple-500/30 flex items-center space-x-1">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" />
                    </svg>
                    <span class="hidden sm:inline">匯入還原</span>
                </button>
                <button id="btn-open-reset" title="清空所有帳目" class="text-xs bg-rose-950/60 hover:bg-rose-900/80 text-rose-200 px-2.5 py-2 rounded-xl transition border border-rose-500/30 flex items-center space-x-1">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                    </svg>
                    <span>清空</span>
                </button>
            </div>
        </div>
    </header>

    <!-- 主要內容區塊 -->
    <main class="max-w-4xl mx-auto px-4 pt-5 space-y-6">

        <!-- 1. 貳仟圓紙鈔風格：雙人即時結算看板 (頂部顯眼卡片) -->
        <section class="banknote-card rounded-3xl shadow-xl border border-purple-400/30 p-5 sm:p-7 text-white">
            <!-- 紙鈔頂部防偽標語 -->
            <div class="flex items-center justify-between text-xs text-purple-200/80 mb-4 border-b border-purple-300/15 pb-2.5">
                <span class="font-serif-banknote tracking-widest flex items-center gap-1.5">
                    <span class="inline-block w-2 h-2 rounded-full bg-amber-300/80"></span>
                    中華民國台灣銀行風格・貳仟圓紫韻帳本
                </span>
                <span id="total-expense-badge" class="bg-white/10 backdrop-blur-xs px-2.5 py-0.5 rounded-full text-purple-100 font-medium">
                    累計總花費：NT$ 0
                </span>
            </div>

            <!-- 雙人頭貼對決與即時結算結果 -->
            <div class="grid grid-cols-1 md:grid-cols-12 gap-5 items-center relative z-10">
                
                <!-- 左側：小及郎 頭貼區 (點擊可換照片) -->
                <div class="md:col-span-3 flex flex-row md:flex-col items-center justify-between md:justify-center bg-white/5 md:bg-transparent p-3 md:p-0 rounded-2xl border border-white/10 md:border-none">
                    <div class="flex items-center md:flex-col gap-3 md:gap-2">
                        <div class="relative group cursor-pointer avatar-upload-trigger" data-member="xiao" title="點擊更換「小及郎」的大頭貼">
                            <img id="hero-avatar-xiao" src="" alt="小及郎" class="w-16 h-16 sm:w-20 sm:h-20 rounded-full object-cover border-3 border-purple-200/80 shadow-lg bg-purple-900 transition transform group-hover:scale-105">
                            <!-- 相機懸浮提示 -->
                            <div class="absolute inset-0 rounded-full bg-black/50 opacity-0 group-hover:opacity-100 flex flex-col items-center justify-center transition">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z" />
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z" />
                                </svg>
                                <span class="text-[10px] text-white font-medium mt-0.5">換頭貼</span>
                            </div>
                            <span class="absolute -bottom-1 -right-1 bg-purple-600 border border-purple-200 text-white p-1 rounded-full shadow-sm">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-3 w-3" viewBox="0 0 20 20" fill="currentColor">
                                    <path d="M13.586 3.586a2 2 0 112.828 2.828l-.793.793-2.828-2.828.793-.793zM11.379 5.793L3 14.172V17h2.828l8.38-8.379-2.83-2.828z" />
                                </svg>
                            </span>
                        </div>
                        <div class="md:text-center">
                            <p class="font-bold text-base sm:text-lg text-white">小及郎</p>
                            <p id="stat-xiao-paid" class="text-xs text-purple-200/80">先墊付 NT$ 0</p>
                        </div>
                    </div>
                    <div class="md:hidden text-right">
                        <span class="text-[11px] text-purple-300 block">點擊頭貼可換照</span>
                    </div>
                </div>

                <!-- 中央：結算核心看板 -->
                <div class="md:col-span-6 bg-black/25 backdrop-blur-md rounded-2xl p-4 sm:p-5 border border-purple-300/20 text-center shadow-inner">
                    <p id="settlement-subtitle" class="text-xs font-medium text-purple-200 tracking-wider mb-1">目前即時結算狀態</p>
                    
                    <!-- 動態顯示誰該給誰多少錢 -->
                    <div id="settlement-main-box" class="my-2">
                        <p class="text-xl sm:text-2xl font-bold text-amber-300">目前互不相欠，已結清！</p>
                    </div>

                    <!-- 一鍵結清按鈕 -->
                    <div class="mt-3 pt-3 border-t border-white/10 flex items-center justify-center gap-3">
                        <button id="btn-settle-up" type="button" 
                            class="bg-gradient-to-r from-amber-400 to-yellow-500 hover:from-amber-300 hover:to-yellow-400 active:scale-95 text-[#2E1442] font-bold text-xs sm:text-sm px-4 py-2 rounded-xl shadow-md transition flex items-center space-x-1.5 disabled:opacity-40 disabled:pointer-events-none">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
                            </svg>
                            <span>一鍵結清歸零</span>
                        </button>
                    </div>
                </div>

                <!-- 右側：湯及 頭貼區 (點擊可換照片) -->
                <div class="md:col-span-3 flex flex-row md:flex-col items-center justify-between md:justify-center bg-white/5 md:bg-transparent p-3 md:p-0 rounded-2xl border border-white/10 md:border-none">
                    <div class="flex items-center md:flex-col gap-3 md:gap-2">
                        <div class="relative group cursor-pointer avatar-upload-trigger" data-member="tang" title="點擊更換「湯及」的大頭貼">
                            <img id="hero-avatar-tang" src="" alt="湯及" class="w-16 h-16 sm:w-20 sm:h-20 rounded-full object-cover border-3 border-purple-200/80 shadow-lg bg-purple-900 transition transform group-hover:scale-105">
                            <!-- 相機懸浮提示 -->
                            <div class="absolute inset-0 rounded-full bg-black/50 opacity-0 group-hover:opacity-100 flex flex-col items-center justify-center transition">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z" />
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z" />
                                </svg>
                                <span class="text-[10px] text-white font-medium mt-0.5">換頭貼</span>
                            </div>
                            <span class="absolute -bottom-1 -right-1 bg-purple-600 border border-purple-200 text-white p-1 rounded-full shadow-sm">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-3 w-3" viewBox="0 0 20 20" fill="currentColor">
                                    <path d="M13.586 3.586a2 2 0 112.828 2.828l-.793.793-2.828-2.828.793-.793zM11.379 5.793L3 14.172V17h2.828l8.38-8.379-2.83-2.828z" />
                                </svg>
                            </span>
                        </div>
                        <div class="md:text-center">
                            <p class="font-bold text-base sm:text-lg text-white">湯及</p>
                            <p id="stat-tang-paid" class="text-xs text-purple-200/80">先墊付 NT$ 0</p>
                        </div>
                    </div>
                    <div class="md:hidden text-right">
                        <span class="text-[11px] text-purple-300 block">點擊頭貼可換照</span>
                    </div>
                </div>

            </div>
        </section>

        <!-- 下方雙欄區：左側新增/編輯記帳，右側消費明細列表 -->
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
            
            <!-- 左側：新增 / 編輯消費表單 (佔 5 欄) -->
            <section class="lg:col-span-5 bg-white/95 backdrop-blur-xs rounded-2xl shadow-sm border border-purple-200/80 p-5 h-fit">
                <div class="flex items-center justify-between mb-3">
                    <h2 id="form-section-title" class="text-base font-bold text-[#3B1E54] flex items-center space-x-2">
                        <span class="w-2 h-5 bg-[#6C3483] rounded-full inline-block"></span>
                        <span>新增一筆消費</span>
                    </h2>
                    <button type="button" id="btn-cancel-edit" class="hidden text-xs font-medium text-rose-600 hover:text-rose-700 bg-rose-50 px-2.5 py-1 rounded-lg">
                        取消編輯
                    </button>
                </div>
                <div class="guilloche-divider rounded-full mb-4"></div>

                <form id="form-expense" class="space-y-4">
                    <input type="hidden" id="edit-expense-id" value="">

                    <!-- 1. 點擊頭貼選擇「誰先付錢」 -->
                    <div>
                        <label class="block text-xs font-bold text-purple-900/80 mb-2">1. 點擊頭貼選擇「誰先付錢」</label>
                        <div class="grid grid-cols-2 gap-3">
                            <!-- 小及郎 付款按鈕 -->
                            <button type="button" id="btn-payer-xiao" data-payer="xiao"
                                class="payer-card-btn flex items-center space-x-2.5 p-2.5 rounded-2xl border-2 border-[#5B2C6F] bg-purple-50/90 transition text-left relative">
                                <img id="form-avatar-xiao" src="" alt="小及郎" class="w-11 h-11 rounded-full object-cover border-2 border-purple-300 shrink-0 bg-purple-100">
                                <div class="min-w-0">
                                    <p class="font-bold text-sm text-[#3B1E54] truncate">小及郎</p>
                                    <p class="payer-status-text text-[11px] font-semibold text-[#6C3483]">✓ 這次我付</p>
                                </div>
                            </button>

                            <!-- 湯及 付款按鈕 -->
                            <button type="button" id="btn-payer-tang" data-payer="tang"
                                class="payer-card-btn flex items-center space-x-2.5 p-2.5 rounded-2xl border-2 border-slate-200 bg-slate-50/70 hover:bg-purple-50/40 transition text-left relative opacity-75">
                                <img id="form-avatar-tang" src="" alt="湯及" class="w-11 h-11 rounded-full object-cover border-2 border-slate-200 shrink-0 bg-purple-100">
                                <div class="min-w-0">
                                    <p class="font-bold text-sm text-slate-700 truncate">湯及</p>
                                    <p class="payer-status-text text-[11px] text-slate-400">點擊切換</p>
                                </div>
                            </button>
                        </div>
                    </div>

                    <!-- 2. 消費項目與快速標籤 -->
                    <div>
                        <label for="input-expense-title" class="block text-xs font-bold text-purple-900/80 mb-1.5">2. 消費項目</label>
                        <input type="text" id="input-expense-title" placeholder="例如：晚餐、手搖飲、全聯採買" required
                            class="w-full bg-purple-50/40 border border-purple-200 text-slate-800 text-sm rounded-xl px-3.5 py-2.5 focus:outline-none focus:ring-2 focus:ring-[#6C3483] focus:bg-white transition">
                        <div class="flex flex-wrap gap-1.5 mt-2">
                            <button type="button" class="quick-tag text-xs bg-purple-50 hover:bg-purple-100 text-purple-800 border border-purple-200/60 px-2.5 py-1 rounded-lg transition">🍱 午餐</button>
                            <button type="button" class="quick-tag text-xs bg-purple-50 hover:bg-purple-100 text-purple-800 border border-purple-200/60 px-2.5 py-1 rounded-lg transition">🍲 晚餐</button>
                            <button type="button" class="quick-tag text-xs bg-purple-50 hover:bg-purple-100 text-purple-800 border border-purple-200/60 px-2.5 py-1 rounded-lg transition">🧋 飲料</button>
                            <button type="button" class="quick-tag text-xs bg-purple-50 hover:bg-purple-100 text-purple-800 border border-purple-200/60 px-2.5 py-1 rounded-lg transition">🛒 採買</button>
                            <button type="button" class="quick-tag text-xs bg-purple-50 hover:bg-purple-100 text-purple-800 border border-purple-200/60 px-2.5 py-1 rounded-lg transition">🚕 車資</button>
                        </div>
                    </div>

                    <!-- 3. 金額輸入 (台幣整數) -->
                    <div>
                        <label for="input-expense-amount" class="block text-xs font-bold text-purple-900/80 mb-1.5">3. 總金額 (新台幣 TWD)</label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-[#5B2C6F] font-bold text-sm pointer-events-none">NT$</span>
                            <input type="number" id="input-expense-amount" placeholder="0" min="1" step="1" inputmode="numeric" required
                                class="w-full bg-purple-50/40 border border-purple-200 text-slate-900 font-bold text-lg rounded-xl pl-12 pr-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-[#6C3483] focus:bg-white transition">
                        </div>
                    </div>

                    <!-- 4. 分攤方式切換 -->
                    <div>
                        <label class="block text-xs font-bold text-purple-900/80 mb-1.5">4. 分攤方式</label>
                        <div class="grid grid-cols-3 gap-1.5 bg-purple-100/70 p-1 rounded-xl">
                            <button type="button" data-mode="equal" class="split-mode-btn text-xs font-bold py-2 px-2 rounded-lg bg-[#5B2C6F] text-white shadow-xs transition">
                                兩人平分
                            </button>
                            <button type="button" data-mode="treat" class="split-mode-btn text-xs font-medium py-2 px-2 rounded-lg text-purple-900 hover:bg-white/60 transition">
                                幫對方全墊
                            </button>
                            <button type="button" data-mode="custom" class="split-mode-btn text-xs font-medium py-2 px-2 rounded-lg text-purple-900 hover:bg-white/60 transition">
                                自訂金額
                            </button>
                        </div>

                        <!-- 分攤預覽或自訂輸入框 -->
                        <div id="split-equal-preview" class="mt-2.5 bg-purple-50/80 border border-purple-100 rounded-xl p-2.5 text-xs text-purple-900 flex justify-between items-center">
                            <span>小及郎應付：<strong id="preview-xiao-share">NT$ 0</strong></span>
                            <span class="text-purple-300">|</span>
                            <span>湯及應付：<strong id="preview-tang-share">NT$ 0</strong></span>
                        </div>

                        <!-- 自訂各自應付金額區塊 (預設隱藏) -->
                        <div id="split-custom-inputs" class="hidden mt-2.5 grid grid-cols-2 gap-2.5 bg-purple-50/80 border border-purple-200/80 rounded-xl p-3">
                            <div>
                                <label class="block text-[11px] font-semibold text-purple-900 mb-1">小及郎 應付</label>
                                <input type="number" id="custom-xiao-amount" min="0" step="1" placeholder="0"
                                    class="w-full bg-white border border-purple-200 rounded-lg px-2.5 py-1.5 text-sm font-semibold text-slate-800 focus:outline-none focus:ring-2 focus:ring-[#6C3483]">
                            </div>
                            <div>
                                <label class="block text-[11px] font-semibold text-purple-900 mb-1">湯及 應付</label>
                                <input type="number" id="custom-tang-amount" min="0" step="1" placeholder="0"
                                    class="w-full bg-white border border-purple-200 rounded-lg px-2.5 py-1.5 text-sm font-semibold text-slate-800 focus:outline-none focus:ring-2 focus:ring-[#6C3483]">
                            </div>
                        </div>
                    </div>

                    <!-- 送出按鈕 -->
                    <button type="submit" id="btn-submit-expense"
                        class="w-full bg-gradient-to-r from-[#4A235A] to-[#6C3483] hover:from-[#3B1E54] hover:to-[#5B2C6F] active:scale-[0.99] text-white font-bold text-sm py-3 rounded-xl shadow-md shadow-purple-900/20 transition flex items-center justify-center space-x-2">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" />
                        </svg>
                        <span id="btn-submit-text">記下這筆消費</span>
                    </button>
                </form>
            </section>

            <!-- 右側：消費明細列表 (佔 7 欄) -->
            <section class="lg:col-span-7 bg-white/95 backdrop-blur-xs rounded-2xl shadow-sm border border-purple-200/80 p-5">
                <div class="flex items-center justify-between mb-3">
                    <h2 class="text-base font-bold text-[#3B1E54] flex items-center space-x-2">
                        <span class="w-2 h-5 bg-amber-500 rounded-full inline-block"></span>
                        <span>消費明細紀錄</span>
                        <span id="expense-count-badge" class="text-xs font-medium bg-purple-100 text-purple-800 px-2 py-0.5 rounded-full">0 筆</span>
                    </h2>
                    <span class="text-xs text-purple-500">點擊項目可快速編輯</span>
                </div>
                <div class="guilloche-divider rounded-full mb-4"></div>

                <!-- 明細列表容器 -->
                <div id="expense-list" class="space-y-3 max-h-[540px] overflow-y-auto pr-1">
                    <!-- 動態生成消費卡片 -->
                </div>
            </section>

        </div>
    </main>

    <!-- 自訂提示訊息 Toast -->
    <div id="toast-notification" class="fixed bottom-5 left-1/2 -translate-x-1/2 z-50 transform transition-all duration-300 translate-y-20 opacity-0 pointer-events-none">
        <div class="bg-[#2E1442] text-purple-50 border border-purple-400/30 text-sm font-medium px-5 py-3 rounded-full shadow-xl flex items-center space-x-2">
            <span id="toast-icon">💜</span>
            <span id="toast-message">提示訊息</span>
        </div>
    </div>

    <!-- 自訂確認對話框 Modal -->
    <div id="confirm-modal" class="fixed inset-0 bg-[#1A0926]/60 backdrop-blur-xs z-50 hidden items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-sm w-full p-6 shadow-2xl border border-purple-200">
            <h3 id="modal-title" class="text-lg font-bold text-[#3B1E54] mb-2">確定執行此操作？</h3>
            <p id="modal-desc" class="text-sm text-slate-600 mb-6">說明內容</p>
            <div class="flex justify-end space-x-3">
                <button id="btn-modal-cancel" class="px-4 py-2 rounded-xl text-sm font-medium text-slate-600 hover:bg-slate-100 transition">
                    取消
                </button>
                <button id="btn-modal-confirm" class="px-4 py-2 rounded-xl text-sm font-bold bg-[#5B2C6F] hover:bg-[#3B1E54] text-white transition shadow-sm">
                    確定
                </button>
            </div>
        </div>
    </div>

    <script>
        /**
         * 小及郎 ＆ 湯及 貳仟圓紫色主題分帳本
         * - 固定雙人成員 ('xiao': 小及郎, 'tang': 湯及)
         * - 支援點擊頭貼上傳本機圖片並透過 Canvas 自動壓縮裁切為正方形 Base64 存入 LocalStorage
         * - 支援點擊消費明細直接帶入表單編輯
         * - 移除 LINE 複製按鈕，新增 JSON 匯出匯入備份功能
         */

        const STORAGE_KEY = 'twd_2000_xiao_tang_v1';

        // 產生預設的精緻 SVG 頭貼 Data URI (當使用者尚未上傳照片時顯示)
        function createDefaultAvatar(label, bgColor, accentColor) {
            const svg = `
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
                    <defs>
                        <linearGradient id="g_${label}" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="${bgColor}"/>
                            <stop offset="100%" stop-color="${accentColor}"/>
                        </linearGradient>
                    </defs>
                    <rect width="120" height="120" fill="url(#g_${label})"/>
                    <circle cx="60" cy="60" r="52" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="2" stroke-dasharray="4 3"/>
                    <text x="60" y="72" font-family="sans-serif" font-size="42" font-weight="bold" fill="#ffffff" text-anchor="middle">${label}</text>
                </svg>
            `.trim();
            return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
        }

        const DEFAULT_AVATARS = {
            xiao: createDefaultAvatar('郎', '#5B2C6F', '#8E44AD'),
            tang: createDefaultAvatar('湯', '#4A235A', '#7D3C98')
        };

        // 應用程式狀態
        let appState = {
            avatars: {
                xiao: DEFAULT_AVATARS.xiao,
                tang: DEFAULT_AVATARS.tang
            },
            expenses: [] // { id, title, amount, payer: 'xiao'|'tang', mode: 'equal'|'treat'|'custom', xiaoShare, tangShare, date }
        };

        // 表單互動狀態
        let currentPayer = 'xiao';
        let currentSplitMode = 'equal';
        let uploadingTargetMember = null;
        let modalConfirmCallback = null;

        // 格式化台幣金額
        function formatTWD(amount) {
            return 'NT$ ' + Math.round(amount).toLocaleString('zh-TW');
        }

        // 防止 XSS 跳脫字元
        function escapeHTML(str) {
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        // 顯示 Toast 提示
        let toastTimer = null;
        function showToast(message, icon = '💜') {
            const toast = document.getElementById('toast-notification');
            document.getElementById('toast-message').textContent = message;
            document.getElementById('toast-icon').textContent = icon;

            toast.classList.remove('translate-y-20', 'opacity-0');
            toast.classList.add('translate-y-0', 'opacity-100');

            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => {
                toast.classList.remove('translate-y-0', 'opacity-100');
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 2500);
        }

        // 開啟 / 關閉確認 Modal
        function openConfirmModal(title, desc, onConfirm) {
            document.getElementById('modal-title').textContent = title;
            document.getElementById('modal-desc').textContent = desc;
            modalConfirmCallback = onConfirm;
            const modal = document.getElementById('confirm-modal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function closeConfirmModal() {
            const modal = document.getElementById('confirm-modal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
            modalConfirmCallback = null;
        }

        // 讀取與儲存 LocalStorage
        function loadState() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                if (raw) {
                    const parsed = JSON.parse(raw);
                    if (parsed.avatars) {
                        appState.avatars.xiao = parsed.avatars.xiao || DEFAULT_AVATARS.xiao;
                        appState.avatars.tang = parsed.avatars.tang || DEFAULT_AVATARS.tang;
                    }
                    if (Array.isArray(parsed.expenses)) {
                        appState.expenses = parsed.expenses;
                    }
                }
            } catch (e) {
                console.error('讀取資料失敗:', e);
            }
        }

        function saveState() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(appState));
            } catch (e) {
                showToast('儲存空間已滿，建議先匯出備份或縮小頭貼照片', '⚠️');
            }
        }

        // ==========================================
        // 圖片壓縮與正方形裁切 (存入 LocalStorage 不佔空間)
        // ==========================================
        function processAndSaveAvatar(file, memberKey) {
            if (!file || !file.type.startsWith('image/')) {
                showToast('請選擇有效的圖片檔案！', '⚠️');
                return;
            }

            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const size = 240; // 壓縮為 240x240 清晰又省空間
                    canvas.width = size;
                    canvas.height = size;
                    const ctx = canvas.getContext('2d');

                    // 置中裁切正方形區域
                    const minSide = Math.min(img.width, img.height);
                    const sx = (img.width - minSide) / 2;
                    const sy = (img.height - minSide) / 2;

                    ctx.drawImage(img, sx, sy, minSide, minSide, 0, 0, size, size);
                    const compressedDataUrl = canvas.toDataURL('image/jpeg', 0.82);

                    appState.avatars[memberKey] = compressedDataUrl;
                    saveState();
                    renderAll();
                    const who = memberKey === 'xiao' ? '小及郎' : '湯及';
                    showToast(`已更新「${who}」的大頭貼！`, '📸');
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        }

        // ==========================================
        // 計算雙人分攤與結算金額
        // ==========================================
        function getCalculatedShares() {
            const total = parseInt(document.getElementById('input-expense-amount').value, 10) || 0;

            if (currentSplitMode === 'equal') {
                const half = Math.round(total / 2);
                return {
                    total,
                    xiaoShare: half,
                    tangShare: total - half
                };
            } else if (currentSplitMode === 'treat') {
                // 付款人幫對方全額代墊（對方應付全額）
                return {
                    total,
                    xiaoShare: currentPayer === 'tang' ? total : 0,
                    tangShare: currentPayer === 'xiao' ? total : 0
                };
            } else {
                // 自訂各自應付金額
                const xiaoCustom = parseInt(document.getElementById('custom-xiao-amount').value, 10) || 0;
                const tangCustom = parseInt(document.getElementById('custom-tang-amount').value, 10) || 0;
                return {
                    total: xiaoCustom + tangCustom,
                    xiaoShare: xiaoCustom,
                    tangShare: tangCustom
                };
            }
        }

        function updateSplitUI() {
            const equalPreview = document.getElementById('split-equal-preview');
            const customInputs = document.getElementById('split-custom-inputs');

            // 更新分攤模式按鈕外觀
            document.querySelectorAll('.split-mode-btn').forEach(btn => {
                if (btn.dataset.mode === currentSplitMode) {
                    btn.className = 'split-mode-btn text-xs font-bold py-2 px-2 rounded-lg bg-[#5B2C6F] text-white shadow-xs transition';
                } else {
                    btn.className = 'split-mode-btn text-xs font-medium py-2 px-2 rounded-lg text-purple-900 hover:bg-white/60 transition';
                }
            });

            if (currentSplitMode === 'custom') {
                equalPreview.classList.add('hidden');
                customInputs.classList.remove('hidden');
            } else {
                equalPreview.classList.remove('hidden');
                customInputs.classList.add('hidden');
                const { xiaoShare, tangShare } = getCalculatedShares();
                document.getElementById('preview-xiao-share').textContent = formatTWD(xiaoShare);
                document.getElementById('preview-tang-share').textContent = formatTWD(tangShare);
            }
        }

        // 更新表單中「誰先付錢」的頭貼卡片選中狀態
        function updatePayerButtonsUI() {
            const btnXiao = document.getElementById('btn-payer-xiao');
            const btnTang = document.getElementById('btn-payer-tang');

            if (currentPayer === 'xiao') {
                btnXiao.className = 'payer-card-btn flex items-center space-x-2.5 p-2.5 rounded-2xl border-2 border-[#5B2C6F] bg-purple-100/70 transition text-left relative shadow-xs';
                btnXiao.querySelector('.payer-status-text').textContent = '✓ 這次我先付';
                btnXiao.querySelector('.payer-status-text').className = 'payer-status-text text-[11px] font-bold text-[#5B2C6F]';

                btnTang.className = 'payer-card-btn flex items-center space-x-2.5 p-2.5 rounded-2xl border-2 border-slate-200 bg-slate-50/70 hover:bg-purple-50/40 transition text-left relative opacity-70';
                btnTang.querySelector('.payer-status-text').textContent = '點擊切換';
                btnTang.querySelector('.payer-status-text').className = 'payer-status-text text-[11px] text-slate-400';
            } else {
                btnTang.className = 'payer-card-btn flex items-center space-x-2.5 p-2.5 rounded-2xl border-2 border-[#5B2C6F] bg-purple-100/70 transition text-left relative shadow-xs';
                btnTang.querySelector('.payer-status-text').textContent = '✓ 這次我先付';
                btnTang.querySelector('.payer-status-text').className = 'payer-status-text text-[11px] font-bold text-[#5B2C6F]';

                btnXiao.className = 'payer-card-btn flex items-center space-x-2.5 p-2.5 rounded-2xl border-2 border-slate-200 bg-slate-50/70 hover:bg-purple-50/40 transition text-left relative opacity-70';
                btnXiao.querySelector('.payer-status-text').textContent = '點擊切換';
                btnXiao.querySelector('.payer-status-text').className = 'payer-status-text text-[11px] text-slate-400';
            }
            updateSplitUI();
        }

        // ==========================================
        // 渲染整個畫面
        // ==========================================
        function renderAll() {
            // 1. 同步所有位置的頭貼圖片
            document.getElementById('hero-avatar-xiao').src = appState.avatars.xiao;
            document.getElementById('hero-avatar-tang').src = appState.avatars.tang;
            document.getElementById('form-avatar-xiao').src = appState.avatars.xiao;
            document.getElementById('form-avatar-tang').src = appState.avatars.tang;

            // 2. 計算總花費與雙人淨額
            let totalExpense = 0;
            let xiaoPaid = 0;
            let tangPaid = 0;
            let xiaoShouldPay = 0;

            appState.expenses.forEach(exp => {
                const amt = Number(exp.amount) || 0;
                totalExpense += amt;
                if (exp.payer === 'xiao') {
                    xiaoPaid += amt;
                } else {
                    tangPaid += amt;
                }
                xiaoShouldPay += Number(exp.xiaoShare) || 0;
            });

            document.getElementById('total-expense-badge').textContent = `累計總花費：${formatTWD(totalExpense)}`;
            document.getElementById('stat-xiao-paid').textContent = `先墊付 ${formatTWD(xiaoPaid)}`;
            document.getElementById('stat-tang-paid').textContent = `先墊付 ${formatTWD(tangPaid)}`;

            // 小及郎淨額 = 實際墊付 - 應該負擔
            // 若 > 0 代表湯及欠小及郎；若 < 0 代表小及郎欠湯及
            const xiaoNet = Math.round(xiaoPaid - xiaoShouldPay);
            const mainBox = document.getElementById('settlement-main-box');
            const settleBtn = document.getElementById('btn-settle-up');

            if (xiaoNet === 0) {
                mainBox.innerHTML = `
                    <p class="text-xl sm:text-2xl font-bold text-amber-300 tracking-wide">✨ 目前互不相欠，已結清！</p>
                `;
                settleBtn.disabled = appState.expenses.length === 0;
            } else if (xiaoNet > 0) {
                mainBox.innerHTML = `
                    <div class="flex items-center justify-center space-x-2 text-sm sm:text-base text-purple-100 mb-1">
                        <span class="font-bold text-white bg-white/15 px-2.5 py-0.5 rounded-lg">湯及</span>
                        <span>應給</span>
                        <span class="font-bold text-white bg-white/15 px-2.5 py-0.5 rounded-lg">小及郎</span>
                    </div>
                    <p class="text-3xl sm:text-4xl font-bold text-amber-300 tracking-tight">${formatTWD(xiaoNet)}</p>
                `;
                settleBtn.disabled = false;
            } else {
                const oweAmount = Math.abs(xiaoNet);
                mainBox.innerHTML = `
                    <div class="flex items-center justify-center space-x-2 text-sm sm:text-base text-purple-100 mb-1">
                        <span class="font-bold text-white bg-white/15 px-2.5 py-0.5 rounded-lg">小及郎</span>
                        <span>應給</span>
                        <span class="font-bold text-white bg-white/15 px-2.5 py-0.5 rounded-lg">湯及</span>
                    </div>
                    <p class="text-3xl sm:text-4xl font-bold text-amber-300 tracking-tight">${formatTWD(oweAmount)}</p>
                `;
                settleBtn.disabled = false;
            }

            // 3. 渲染消費明細列表
            renderExpenseList();
        }

        function renderExpenseList() {
            const listEl = document.getElementById('expense-list');
            const countBadge = document.getElementById('expense-count-badge');
            countBadge.textContent = `${appState.expenses.length} 筆`;
            listEl.innerHTML = '';

            if (appState.expenses.length === 0) {
                listEl.innerHTML = `
                    <div class="text-center py-10 bg-purple-50/50 rounded-2xl border border-dashed border-purple-200">
                        <p class="text-sm font-medium text-purple-900/70">目前還沒有消費紀錄喔！</p>
                        <p class="text-xs text-purple-400 mt-1">在左側選擇誰先付錢並輸入金額即可開始記帳</p>
                    </div>
                `;
                return;
            }

            const reversed = [...appState.expenses].reverse();
            reversed.forEach(exp => {
                const isXiaoPayer = exp.payer === 'xiao';
                const payerName = isXiaoPayer ? '小及郎' : '湯及';
                const payerAvatar = isXiaoPayer ? appState.avatars.xiao : appState.avatars.tang;

                let modeLabel = '兩人平分';
                if (exp.mode === 'treat') {
                    modeLabel = isXiaoPayer ? '幫湯及全墊' : '幫小及郎全墊';
                } else if (exp.mode === 'custom') {
                    modeLabel = `自訂 (郎${exp.xiaoShare} / 湯${exp.tangShare})`;
                }

                const card = document.createElement('div');
                card.dataset.id = exp.id;
                card.className = 'expense-item-card cursor-pointer flex items-center justify-between bg-purple-50/40 hover:bg-purple-100/60 border border-purple-200/70 rounded-2xl p-3.5 transition group';
                card.innerHTML = `
                    <div class="flex items-center space-x-3 min-w-0 flex-1 pr-2">
                        <img src="${payerAvatar}" alt="${payerName}" class="w-11 h-11 rounded-full object-cover border-2 border-purple-300 shrink-0 shadow-2xs">
                        <div class="min-w-0 flex-1">
                            <div class="flex items-center space-x-2">
                                <h4 class="font-bold text-slate-800 text-sm sm:text-base truncate">${escapeHTML(exp.title)}</h4>
                            </div>
                            <div class="flex flex-wrap items-center gap-1.5 mt-1 text-xs">
                                <span class="bg-[#5B2C6F] text-white px-2 py-0.5 rounded-md font-medium">${payerName}先付</span>
                                <span class="text-purple-800/80 bg-purple-100 px-2 py-0.5 rounded-md">${modeLabel}</span>
                                <span class="text-slate-400 text-[11px]">${escapeHTML(exp.date || '')}</span>
                            </div>
                        </div>
                    </div>
                    <div class="flex items-center space-x-2 shrink-0">
                        <span class="font-bold text-[#3B1E54] text-base sm:text-lg">${formatTWD(exp.amount)}</span>
                        <button type="button" data-id="${exp.id}" class="btn-delete-expense text-slate-400 hover:text-rose-600 p-2 rounded-xl hover:bg-rose-50 transition" title="刪除此筆紀錄">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                            </svg>
                        </button>
                    </div>
                `;
                listEl.appendChild(card);
            });
        }

        // 重置表單回「新增模式」
        function resetExpenseForm() {
            document.getElementById('edit-expense-id').value = '';
            document.getElementById('input-expense-title').value = '';
            document.getElementById('input-expense-amount').value = '';
            document.getElementById('custom-xiao-amount').value = '';
            document.getElementById('custom-tang-amount').value = '';
            document.getElementById('form-section-title').innerHTML = `
                <span class="w-2 h-5 bg-[#6C3483] rounded-full inline-block"></span>
                <span>新增一筆消費</span>
            `;
            document.getElementById('btn-submit-text').textContent = '記下這筆消費';
            document.getElementById('btn-cancel-edit').classList.add('hidden');
            currentSplitMode = 'equal';
            updatePayerButtonsUI();
        }

        // ==========================================
        // 事件綁定
        // ==========================================
        document.addEventListener('DOMContentLoaded', () => {
            loadState();
            updatePayerButtonsUI();
            renderAll();

            // 1. 點擊頭貼觸發上傳照片
            const avatarFileInput = document.getElementById('avatar-file-input');
            document.querySelectorAll('.avatar-upload-trigger').forEach(el => {
                el.addEventListener('click', () => {
                    uploadingTargetMember = el.dataset.member;
                    avatarFileInput.value = '';
                    avatarFileInput.click();
                });
            });

            avatarFileInput.addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (file && uploadingTargetMember) {
                    processAndSaveAvatar(file, uploadingTargetMember);
                }
            });

            // 2. 點擊頭貼卡片切換「誰先付錢」
            document.querySelectorAll('.payer-card-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    currentPayer = btn.dataset.payer;
                    updatePayerButtonsUI();
                });
            });

            // 3. 快速項目標籤
            document.querySelectorAll('.quick-tag').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.getElementById('input-expense-title').value = btn.textContent.trim();
                    document.getElementById('input-expense-amount').focus();
                });
            });

            // 4. 分攤模式切換與即時計算
            document.querySelectorAll('.split-mode-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    currentSplitMode = btn.dataset.mode;
                    if (currentSplitMode === 'custom') {
                        const total = parseInt(document.getElementById('input-expense-amount').value, 10) || 0;
                        const half = Math.round(total / 2);
                        document.getElementById('custom-xiao-amount').value = half || '';
                        document.getElementById('custom-tang-amount').value = (total - half) || '';
                    }
                    updateSplitUI();
                });
            });

            document.getElementById('input-expense-amount').addEventListener('input', updateSplitUI);

            // 自訂金額雙向連動總金額
            document.getElementById('custom-xiao-amount').addEventListener('input', () => {
                const x = parseInt(document.getElementById('custom-xiao-amount').value, 10) || 0;
                const t = parseInt(document.getElementById('custom-tang-amount').value, 10) || 0;
                document.getElementById('input-expense-amount').value = x + t;
            });
            document.getElementById('custom-tang-amount').addEventListener('input', () => {
                const x = parseInt(document.getElementById('custom-xiao-amount').value, 10) || 0;
                const t = parseInt(document.getElementById('custom-tang-amount').value, 10) || 0;
                document.getElementById('input-expense-amount').value = x + t;
            });

            // 5. 送出新增或編輯消費
            document.getElementById('form-expense').addEventListener('submit', (e) => {
                e.preventDefault();
                const editId = document.getElementById('edit-expense-id').value;
                const title = document.getElementById('input-expense-title').value.trim();
                const { total, xiaoShare, tangShare } = getCalculatedShares();

                if (!title) {
                    showToast('請輸入消費項目名稱！', '⚠️');
                    return;
                }
                if (total <= 0) {
                    showToast('請輸入大於 0 的台幣整數金額！', '⚠️');
                    return;
                }

                const todayStr = new Date().toLocaleDateString('zh-TW', { month: 'numeric', day: 'numeric' });

                if (editId) {
                    // 更新既有紀錄
                    const idx = appState.expenses.findIndex(item => item.id === editId);
                    if (idx !== -1) {
                        appState.expenses[idx] = {
                            ...appState.expenses[idx],
                            title,
                            amount: total,
                            payer: currentPayer,
                            mode: currentSplitMode,
                            xiaoShare,
                            tangShare
                        };
                        showToast(`已更新「${title}」`, '✏️');
                    }
                } else {
                    // 新增紀錄
                    appState.expenses.push({
                        id: 'exp_' + Date.now(),
                        title,
                        amount: total,
                        payer: currentPayer,
                        mode: currentSplitMode,
                        xiaoShare,
                        tangShare,
                        date: todayStr
                    });
                    showToast(`已記下「${title}」${formatTWD(total)}`, '💜');
                }

                saveState();
                resetExpenseForm();
                renderAll();
            });

            // 6. 點擊明細卡片編輯 或 點擊垃圾桶刪除
            document.getElementById('expense-list').addEventListener('click', (e) => {
                const delBtn = e.target.closest('.btn-delete-expense');
                if (delBtn) {
                    e.stopPropagation();
                    const id = delBtn.dataset.id;
                    appState.expenses = appState.expenses.filter(item => item.id !== id);
                    if (document.getElementById('edit-expense-id').value === id) {
                        resetExpenseForm();
                    }
                    saveState();
                    renderAll();
                    showToast('已刪除該筆消費', '🗑️');
                    return;
                }

                const card = e.target.closest('.expense-item-card');
                if (card) {
                    const id = card.dataset.id;
                    const target = appState.expenses.find(item => item.id === id);
                    if (!target) return;

                    // 帶入表單進入編輯狀態
                    document.getElementById('edit-expense-id').value = target.id;
                    document.getElementById('input-expense-title').value = target.title;
                    document.getElementById('input-expense-amount').value = target.amount;
                    currentPayer = target.payer;
                    currentSplitMode = target.mode || 'equal';

                    if (currentSplitMode === 'custom') {
                        document.getElementById('custom-xiao-amount').value = target.xiaoShare;
                        document.getElementById('custom-tang-amount').value = target.tangShare;
                    }

                    document.getElementById('form-section-title').innerHTML = `
                        <span class="w-2 h-5 bg-amber-500 rounded-full inline-block"></span>
                        <span>編輯這筆消費</span>
                    `;
                    document.getElementById('btn-submit-text').textContent = '儲存修改';
                    document.getElementById('btn-cancel-edit').classList.remove('hidden');

                    updatePayerButtonsUI();
                    // 手機版自動捲動到表單上方方便編輯
                    document.getElementById('form-expense').scrollIntoView({ behavior: 'smooth', block: 'center' });
                }
            });

            document.getElementById('btn-cancel-edit').addEventListener('click', resetExpenseForm);

            // 7. 一鍵結清歸零按鈕
            document.getElementById('btn-settle-up').addEventListener('click', () => {
                if (appState.expenses.length === 0) return;
                openConfirmModal(
                    '確定要一鍵結清嗎？',
                    '結清後將會清空目前的消費明細（兩位的大頭貼會保留），讓雙方從 NT$ 0 重新計算。',
                    () => {
                        appState.expenses = [];
                        saveState();
                        resetExpenseForm();
                        renderAll();
                        showToast('雙方帳目已一鍵結清歸零！', '✨');
                    }
                );
            });

            // 8. 頂部清空按鈕
            document.getElementById('btn-open-reset').addEventListener('click', () => {
                openConfirmModal(
                    '清空所有消費紀錄？',
                    '確定要清除所有已記下的消費嗎？（大頭貼照片會為您保留）',
                    () => {
                        appState.expenses = [];
                        saveState();
                        resetExpenseForm();
                        renderAll();
                        showToast('已清空所有消費明細', '🧹');
                    }
                );
            });

            // 9. 匯出備份 (.json)
            document.getElementById('btn-export-backup').addEventListener('click', () => {
                const dataStr = JSON.stringify(appState, null, 2);
                const blob = new Blob([dataStr], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                const dateTag = new Date().toISOString().slice(0, 10);
                a.href = url;
                a.download = `小及郎與湯及_分帳備份_${dateTag}.json`;
                a.click();
                URL.revokeObjectURL(url);
                showToast('已下載備份檔案 (.json)', '💾');
            });

            // 10. 匯入備份還原
            const backupFileInput = document.getElementById('backup-file-input');
            document.getElementById('btn-import-backup').addEventListener('click', () => {
                backupFileInput.value = '';
                backupFileInput.click();
            });

            backupFileInput.addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (evt) => {
                    try {
                        const imported = JSON.parse(evt.target.result);
                        if (imported && Array.isArray(imported.expenses)) {
                            appState.expenses = imported.expenses;
                            if (imported.avatars) {
                                appState.avatars.xiao = imported.avatars.xiao || DEFAULT_AVATARS.xiao;
                                appState.avatars.tang = imported.avatars.tang || DEFAULT_AVATARS.tang;
                            }
                            saveState();
                            resetExpenseForm();
                            renderAll();
                            showToast('備份資料與頭貼已成功還原！', '🎉');
                        } else {
                            showToast('備份檔案格式不正確', '⚠️');
                        }
                    } catch (err) {
                        showToast('讀取備份檔案失敗', '❌');
                    }
                };
                reader.readAsText(file);
            });

            // Modal 按鈕控制
            document.getElementById('btn-modal-cancel').addEventListener('click', closeConfirmModal);
            document.getElementById('btn-modal-confirm').addEventListener('click', () => {
                if (typeof modalConfirmCallback === 'function') {
                    modalConfirmCallback();
                }
                closeConfirmModal();
            });
        });
    </script>
</body>
</html>
